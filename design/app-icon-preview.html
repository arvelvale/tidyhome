<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>图标预览</title>
<style>
  body { margin: 0; padding: 32px; background: #28313D; font-family: system-ui, sans-serif; color: #fff; display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; font-size: 13px; opacity: .9; }
  svg { display: block; margin: 0 auto 8px; }
</style></head>
<body>
<!-- 与 res/drawable/ic_launcher_foreground.xml 同一组路径；圆形 / 圆角方形两种遮罩模拟不同桌面 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="icon" viewBox="0 0 108 108">
      <rect width="108" height="108" fill="#3A8CE0"/>
      <path fill="#FFFFFF" d="M44,33 h20 a11,11 0 0 1 11,11 v20 a11,11 0 0 1 -11,11 h-20 a11,11 0 0 1 -11,-11 v-20 a11,11 0 0 1 11,-11 z"/>
      <path fill="#43C27A" d="M42.5,39 h6 a3.5,3.5 0 0 1 3.5,3.5 v6 a3.5,3.5 0 0 1 -3.5,3.5 h-6 a3.5,3.5 0 0 1 -3.5,-3.5 v-6 a3.5,3.5 0 0 1 3.5,-3.5 z"/>
      <path fill="#FF9A52" d="M59.5,39 h6 a3.5,3.5 0 0 1 3.5,3.5 v6 a3.5,3.5 0 0 1 -3.5,3.5 h-6 a3.5,3.5 0 0 1 -3.5,-3.5 v-6 a3.5,3.5 0 0 1 3.5,-3.5 z"/>
      <path fill="#FF7FA8" d="M42.5,56 h6 a3.5,3.5 0 0 1 3.5,3.5 v6 a3.5,3.5 0 0 1 -3.5,3.5 h-6 a3.5,3.5 0 0 1 -3.5,-3.5 v-6 a3.5,3.5 0 0 1 3.5,-3.5 z"/>
      <path fill="#3A8CE0" d="M59.5,56 h6 a3.5,3.5 0 0 1 3.5,3.5 v6 a3.5,3.5 0 0 1 -3.5,3.5 h-6 a3.5,3.5 0 0 1 -3.5,-3.5 v-6 a3.5,3.5 0 0 1 3.5,-3.5 z"/>
      <path fill="#FFD25A" d="M77,24 Q77.8,30.2 84,31 Q77.8,31.8 77,38 Q76.2,31.8 70,31 Q76.2,30.2 77,24 z"/>
    </symbol>
    <clipPath id="circle"><circle cx="54" cy="54" r="36"/></clipPath>
    <clipPath id="squircle"><rect x="18" y="18" width="72" height="72" rx="20"/></clipPath>
  </defs>
</svg>
<figure><svg width="160" height="160" viewBox="18 18 72 72"><use href="#icon" width="108" height="108" clip-path="url(#circle)"/></svg>圆形遮罩</figure>
<figure><svg width="160" height="160" viewBox="18 18 72 72"><use href="#icon" width="108" height="108" clip-path="url(#squircle)"/></svg>圆角方形（ColorOS）</figure>
<figure><svg width="60" height="60" viewBox="18 18 72 72"><use href="#icon" width="108" height="108" clip-path="url(#squircle)"/></svg>桌面实际大小</figure>
</body></html>
