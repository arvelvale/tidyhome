<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>og-card</title>
<!-- 分享预览图 1200×630 的源文件。用 Edge 无头截图生成 site/og.png：见 design/README 或 git log -->
<style>
@font-face { font-family: "Geist"; src: url("../site/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Noto SC"; src: url("../site/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1200px; height: 630px; background: #fff; font-family: "Geist", "Noto SC", sans-serif; color: #1E2228; overflow: hidden; }
.card { position: relative; width: 1200px; height: 630px; padding: 84px 96px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 22px; }
.brand img { width: 92px; height: 92px; border-radius: 24px; }
.brand b { font-size: 40px; font-weight: 600; }
h1 { margin: 54px 0 0; font-size: 104px; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; }
p { margin: 30px 0 0; font-size: 34px; color: #5F636A; }
.chips { position: absolute; right: 96px; top: 176px; width: 440px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chips span { height: 150px; border-radius: 32px; display: flex; align-items: flex-end; padding: 0 0 22px 26px; box-sizing: border-box; font-size: 30px; font-weight: 500; }
.badge { position: absolute; right: 96px; top: 84px; padding: 10px 22px 10px 18px; border-radius: 999px; background: #FCF4E3; color: #7C5600; font-size: 26px; display: flex; align-items: center; gap: 12px; }
.badge::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #E29936; }
</style></head>
<body>
<div class="card">
  <div class="brand"><img src="../site/logo.svg" alt=""><b>一键理桌</b></div>
  <h1>桌面乱了，<br>就交给我。</h1>
  <p>把安卓桌面的图标，按类别收进文件夹。</p>
  <div class="badge">开发中</div>
  <div class="chips">
    <span style="background:#EAF9EC;color:#197037">社交</span>
    <span style="background:#FFF0E7;color:#934319">购物</span>
    <span style="background:#FFEEF5;color:#903C61">影音</span>
    <span style="background:#E9F6FF;color:#1A609E">学习办公</span>
  </div>
</div>
</body></html>
